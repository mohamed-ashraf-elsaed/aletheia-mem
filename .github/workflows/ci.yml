name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    # Linux only. macOS and Windows are untested (docs/tasks/unverified.md, item 35).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Test suite
        run: bun test
      - name: Task table and task files agree
        run: bun scripts/check-tasks.mjs
      - name: Generated tables are current
        run: bun scripts/gen-tables.mjs --check
      - name: Relative documentation links resolve
        run: bun scripts/check-docs-links.mjs
      - name: Translations match the English README
        run: bun scripts/i18n-check.mjs
