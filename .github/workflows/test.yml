name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Test suite and run report
        run: bun scripts/run-report.mjs
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-report-${{ matrix.os }}
          path: docs/tasks/run-report.md
          if-no-files-found: ignore
