name: Release
# Runs when the owner pushes a tag such as v0.1.1. Push the tag only after the checks pass on main.
#
# Owner one-time setup (nothing here publishes until one of these is done):
#   Option A, npm trusted publishing (no stored secret): on npmjs.com open the package, Settings,
#     Trusted Publisher, add GitHub Actions with this repository and the workflow file release.yml.
#     Then set the repository variable NPM_TRUSTED_PUBLISHING to true (Settings, Variables).
#     Trusted publishing needs a recent npm; the step below installs npm@latest.
#   Option B, a token: create a granular access token on npmjs.com, limited to the package aletheia-mem,
#     read and write, with the option that bypasses 2FA for writes. Store it as the repository secret NPM_TOKEN.
#   Option C, MCP registry OIDC (recommended, no stored secret): set the repository variable
#     MCP_REGISTRY_PUBLISH to true. The step logs in with this workflow's OIDC token (id-token: write),
#     which the registry maps to the personal namespace io.github.mohamed-ashraf-elsaed/.
#   Option D, a token: store a GitHub PAT as the repository secret MCP_GITHUB_TOKEN. The registry only
#     reads the namespace owner, so a bare classic PAT is enough for this personal namespace; give it
#     read:org if the project ever moves under an organization.
#   Option E, notify the distribution server (optional): set the repository variable DISTRO_URL (for example
#     https://distro.example.com, no trailing slash) and the repository secret DISTRO_WEBHOOK_SECRET to the same value
#     as GITHUB_WEBHOOK_SECRET on the server. (GitHub rejects repository secret names that start with GITHUB_, so the
#     secret cannot be called GITHUB_WEBHOOK_SECRET_DISTRO.) A release made with the workflow token does not fire the
#     release webhook, so the last-but-one step POSTs an HMAC-signed release payload to $DISTRO_URL/api/webhooks/github.
#     Skipped cleanly when either is unset.
# With neither, the publish steps are skipped and the run only tests, verifies and makes the GitHub release.
# The server.json bump and the docs changelog page are not optional: every tag run bumps server.json to the
# tag (pushed to main) and rebuilds the site with the changelog page (pushed to main, which deploys pages).
#
# Permissions the push to main needs: the workflow token has contents: write below, and main must allow it.
# If main has branch protection or a ruleset, add "github-actions" (the GitHub Actions app) to the bypass list for
# pushes, or the last push step fails. Settings, Actions, General must also give workflows read and write permission.
# The distro notification runs before that push, so a refused push does not stop it.
#
# Manual run (workflow_dispatch): choose the branch, give an existing tag, and keep dry_run true to run only the tests
# and the release verification. dry_run false runs every step for that tag, including publishing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as v0.1.12
        required: true
        type: string
      dry_run:
        description: Run only the tests and the release verification; publish nothing
        required: true
        type: boolean
        default: true
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      MCP_GITHUB_TOKEN: ${{ secrets.MCP_GITHUB_TOKEN }}
      DISTRO_WEBHOOK_SECRET: ${{ secrets.DISTRO_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - name: Sync server.json to the release version
        run: bun scripts/release.mjs --sync-server-json "$TAG"
      - name: Test suite
        run: bun test --timeout 20000
      - name: Verify release files for this tag
        run: bun scripts/release.mjs --verify --tag "$TAG"
      - name: Publish to npm
        if: ${{ inputs.dry_run != true && (env.NPM_TOKEN != '' || vars.NPM_TRUSTED_PUBLISHING == 'true') }}
        run: |
          npm install -g npm@latest
          if [ -n "$NODE_AUTH_TOKEN" ]; then echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN" > "$HOME/.npmrc"; fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --verify-tag
      - name: Rebuild the docs site
        run: |
          bun scripts/build-site.mjs
          bun scripts/check-sitemap.mjs
      - name: Notify the distribution server
        if: ${{ inputs.dry_run != true && vars.DISTRO_URL != '' && env.DISTRO_WEBHOOK_SECRET != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DISTRO_URL: ${{ vars.DISTRO_URL }}
          DISTRO_WEBHOOK_SECRET: ${{ secrets.DISTRO_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          release="$(gh release view "$TAG" --json name,body,tagName)"
          previous="$(gh release list --exclude-drafts --exclude-pre-releases --limit 20 --json tagName --jq '.[].tagName' | grep -vxF "$TAG" | head -n 1 || true)"
          payload="$(jq -cn --argjson release "$release" --arg previous "$previous" \
            '{action: "published", release: {tag_name: $release.tagName, name: $release.name, body: $release.body}} + (if $previous == "" then {} else {previousTag: $previous} end)')"
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$DISTRO_WEBHOOK_SECRET" | sed 's/^.* //')"
          curl --fail --silent --show-error --max-time 30 -X POST "${DISTRO_URL%/}/api/webhooks/github" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: release" \
            -H "X-Hub-Signature-256: $signature" \
            --data-binary "$payload"
      - name: Push server.json and the changelog page to main
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          git clone --depth=1 --branch main "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$dir"
          cd "$dir"
          bun scripts/release.mjs --sync-server-json "$TAG"
          rm -rf site/docs site/assets
          cp -r "$GITHUB_WORKSPACE/site/docs" "$GITHUB_WORKSPACE/site/assets" site/
          cp "$GITHUB_WORKSPACE/site/sitemap.xml" "$GITHUB_WORKSPACE/site/robots.txt" "$GITHUB_WORKSPACE/site/llms.txt" "$GITHUB_WORKSPACE/site/llms-full.txt" site/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.json site
          if git diff --cached --quiet; then
            echo "main already has this release's server.json and changelog page"
          else
            git commit -m "Release $TAG: sync server.json and the docs changelog page"
            git push origin main
          fi
      - name: Install cosign
        if: ${{ inputs.dry_run != true && (env.NPM_TOKEN != '' || vars.NPM_TRUSTED_PUBLISHING == 'true') && (env.MCP_GITHUB_TOKEN != '' || vars.MCP_REGISTRY_PUBLISH == 'true') }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish to the MCP registry
        if: ${{ inputs.dry_run != true && (env.NPM_TOKEN != '' || vars.NPM_TRUSTED_PUBLISHING == 'true') && (env.MCP_GITHUB_TOKEN != '' || vars.MCP_REGISTRY_PUBLISH == 'true') }}
        env:
          MCP_PUBLISHER_VERSION: v1.8.7
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
          if [ -n "$MCP_GITHUB_TOKEN" ]; then
            ./mcp-publisher login github --token "$MCP_GITHUB_TOKEN"
          else
            ./mcp-publisher login github-oidc
          fi
          ./mcp-publisher publish
