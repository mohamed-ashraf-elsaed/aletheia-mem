<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/work-view/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aletheia</title>
    <!-- The Work tab runs the Work page inside an iframe (work.html), so its styles cannot clash with this page. -->
    <link rel="stylesheet" href="/hub/style.css" />
    <link rel="stylesheet" href="/work-view/one-ui.css" />
    <script type="module" src="/work-view/one-ui.js"></script>
  </head>
  <body>
    <header class="ui-top">
      <a class="ui-brand" href="#/work">Aletheia</a>
      <nav id="ui-tabs" class="ui-tabs" role="tablist" aria-label="Sections"></nav>
      <span class="ui-spacer"></span>
      <label class="ui-sr" for="ui-project">Project</label>
      <select id="ui-project" class="ui-select" aria-label="Project">
        <option value="">All projects</option>
      </select>
      <form id="ui-search-form" class="ui-search" role="search">
        <label class="ui-sr" for="ui-search">Search memory</label>
        <input id="ui-search" type="search" placeholder="Search memory…" aria-label="Search memory" autocomplete="off" />
        <button type="submit">Search</button>
      </form>
      <span id="ui-health" class="ui-health checking" role="status" aria-live="polite" aria-label="Checking server health">○</span>
    </header>

    <main class="ui-main">
      <section id="tab-work" class="ui-tab ui-tab-work" data-tab="work" role="tabpanel" aria-label="Work">
        <iframe id="work-frame" class="ui-work-frame" src="/work-view/work.html" title="Work"></iframe>
      </section>
      <section id="tab-memory" class="ui-tab" data-tab="memory" role="tabpanel" aria-label="Memory" hidden>
        <div id="ui-memory"></div>
      </section>
      <section id="tab-rules" class="ui-tab" data-tab="rules" role="tabpanel" aria-label="Rules" hidden>
        <div id="ui-rules"></div>
      </section>
      <section id="tab-tools" class="ui-tab" data-tab="tools" role="tabpanel" aria-label="Tools" hidden>
        <div id="ui-tools"></div>
      </section>
    </main>

    <div id="ui-toast" class="ui-toast" role="status"></div>
  </body>
</html>
