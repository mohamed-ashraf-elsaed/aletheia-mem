<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" id="ui-favicon" type="image/png" href="/work-view/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Aletheia</title>
    <script src="/work-view/ui-theme-init.js"></script>
    <link rel="stylesheet" href="/work-view/ui-theme.css" />
    <link rel="stylesheet" href="/work-view/ui-components.css" />
    <link rel="stylesheet" href="/work-view/one-ui.css" />
    <script type="module" src="/work-view/one-ui.js"></script>
  </head>
  <body>
    <a class="ui-skip" href="#ui-main">Skip to the page</a>
    <div id="ui-app" class="ui-app">
      <div id="ui-banner-slot" class="ui-banner-slot"></div>
      <header class="ui-top">
        <a class="ui-brand" href="#/home" aria-label="Aletheia, home">
          <span id="ui-brand-mark" class="ui-brand-mark" aria-hidden="true"></span>
          <span class="ui-brand-word">Aletheia</span>
        </a>
        <nav id="ui-tabs" class="ui-nav" aria-label="Sections"></nav>
        <span class="ui-spacer"></span>
        <label class="ui-sr" for="ui-project">Project</label>
        <select id="ui-project" class="ui-select ui-project" aria-label="Project">
          <option value="">All projects</option>
        </select>
        <form id="ui-search-form" class="ui-search" role="search">
          <label class="ui-sr" for="ui-search">Search memory</label>
          <div class="ui-search-box">
            <input id="ui-search" type="search" placeholder="Search memory…" aria-label="Search memory" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="ui-search-list" aria-autocomplete="list" />
            <kbd class="ui-search-key" aria-hidden="true">/</kbd>
            <div id="ui-search-list" class="ui-search-list" role="listbox" aria-label="Search results" hidden></div>
          </div>
        </form>
        <div id="ui-theme" class="ui-theme-slot"></div>
        <span id="ui-health" class="ui-health checking ui-sr" role="status" aria-live="polite" aria-label="Checking server health">○</span>
      </header>
      <div id="ui-status" class="ui-statusbar" role="region" aria-label="System status"></div>

      <main id="ui-main" class="ui-main" tabindex="-1">
        <section id="tab-home" class="ui-page" data-tab="home" role="tabpanel" aria-label="Home">
          <div id="ui-home"></div>
        </section>
        <section id="tab-work" class="ui-page ui-page-work" data-tab="work" role="tabpanel" aria-label="Activity" hidden>
          <div id="ui-work"></div>
        </section>
        <section id="tab-memory" class="ui-page" data-tab="memory" role="tabpanel" aria-label="Knowledge" hidden>
          <div id="ui-memory"></div>
        </section>
        <section id="tab-rules" class="ui-page" data-tab="rules" role="tabpanel" aria-label="Rules" hidden>
          <div id="ui-rules"></div>
        </section>
        <section id="tab-tools" class="ui-page" data-tab="tools" role="tabpanel" aria-label="Connections" hidden>
          <div id="ui-tools"></div>
        </section>
      </main>
    </div>

    <div id="ui-toast" class="ui-sr" role="status"></div>
    <div id="ui-announcer" class="ui-sr" role="status" aria-live="polite"></div>
  </body>
</html>
